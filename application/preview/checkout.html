<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — APEXIK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="preview.css"></head>
<body class="preview-page"><!-- THESIS: The buying step is transparent and low-friction. OWN-WORLD: calm white form fields on warm paper with signal-red action. STORY: identify, deliver, review, pay. FIRST VIEWPORT: contact and delivery left, sticky total right. FORM: Woo checkout block structure prototype. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance --><div data-preview-header></div><main id="main" class="preview-checkout"><div class="apx-shell"><h1>Checkout</h1><div class="preview-checkout__grid"><form data-preview-checkout><section class="preview-form-section"><h2>Contact</h2><div class="preview-fields"><label class="full">Email<input type="email" autocomplete="email" placeholder="fan@example.com" required></label></div></section><section class="preview-form-section"><h2>Delivery</h2><div class="preview-fields"><label>First name<input type="text" autocomplete="given-name" required></label><label>Last name<input type="text" autocomplete="family-name" required></label><label class="full">Address<input type="text" autocomplete="street-address" required></label><label>City<input type="text" autocomplete="address-level2" required></label><label>Postcode<input type="text" autocomplete="postal-code" required></label><label class="full">Country / region<select autocomplete="country"><option>Netherlands</option><option>United Kingdom</option><option>Germany</option><option>United States</option><option>Japan</option><option>Australia</option><option>Brazil</option></select></label></div></section><section class="preview-form-section"><h2>Payment</h2><div class="preview-payment"><label><input type="radio" checked> Test payment — no charge</label><p style="font-size:.76rem;color:var(--apx-muted)">Real gateways remain WooCommerce-managed.</p></div></section></form><aside class="preview-summary"><h2>Your order</h2><dl><div><dt>Desk Mat × 1</dt><dd>€39.00</dd></div><div><dt>Sticker × 1</dt><dd>€9.00</dd></div><div><dt>Shipping</dt><dd>€8.00</dd></div><div><dt><strong>Total</strong></dt><dd><strong>€56.00</strong></dd></div></dl><button class="apx-button" type="button" data-test-order>Place test order</button><p style="font-size:.7rem;color:var(--apx-muted)">Shipping, tax and order submission are illustrative only.</p><p class="apx-form-status" data-order-status aria-live="polite"></p></aside></div></div></main><div data-preview-footer></div><div class="preview-note"><span>Prototype</span> · checkout block mapping</div><script defer src="common.js"></script><script defer src="../wordpress/wp-content/themes/apexik-automobilist/assets/js/site.js"></script></body></html>
